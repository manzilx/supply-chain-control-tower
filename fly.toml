# fly.toml app configuration file generated for scm-towerx on 2026-05-14T23:37:30+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scm-towerx'
primary_region = 'sjc'

[build]
  dockerfile = 'Dockerfile.combined'

[env]
  APP_ENV = 'prod'
  PORT = '8080'
  SNAPSHOT_INTERVAL_SECONDS = '120'
  STATE_DIR = '/data'
  UVICORN_WORKERS = '1'

[[mounts]]
  source = 'state'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
