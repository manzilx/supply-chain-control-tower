; supervisord — manages backend + frontend + nginx in the single-container build.
[supervisord]
nodaemon=true
user=app
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[program:backend]
command=uvicorn app.main:app --host 127.0.0.1 --port 8010 --workers %(ENV_UVICORN_WORKERS)s --proxy-headers --forwarded-allow-ips=*
directory=/srv
user=app
autorestart=true
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=PYTHONUNBUFFERED="1",APP_ENV="prod",STATE_DIR="/data"

[program:frontend]
command=node server.js
directory=/srv/frontend
user=app
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
environment=NODE_ENV="production",PORT="3001",HOSTNAME="127.0.0.1"

[program:nginx]
command=nginx -g "daemon off;"
user=app
autorestart=true
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
